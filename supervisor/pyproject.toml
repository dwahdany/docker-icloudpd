[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icloudpd-supervisor"
version = "1.2.1"
description = "Supervisor for icloudpd: scheduling, Telegram 2FA relay, notifications"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    # The software security key is tested against python-fido2 itself. At
    # run time both come with icloudpd (>= 1.33.0), which pins fido2.
    "fido2>=2.2,<3",
    "cryptography",
]

[project.scripts]
icloudpd-supervisor = "icloudpd_supervisor.main:main"

[tool.setuptools.packages.find]
include = ["icloudpd_supervisor*"]

[tool.pytest.ini_options]
timeout = 30
testpaths = ["tests"]
filterwarnings = [
    # Raised by the stdlib itself when the malformed-cookiejar tolerance
    # tests feed it a broken file; not a defect in this package.
    "ignore:http.cookiejar bug!:UserWarning",
]
