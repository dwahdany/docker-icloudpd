name: CI

on:
  push:
    branches: [master, rewrite]
    tags: ["v*"]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: pip install -e "./supervisor[dev]"
      - name: Install yubikit (for the YubiKey-held security key)
        # Without dependencies, as in the image: only its yubikit library is
        # used, and its pyscard dependency needs a C build with PC/SC headers.
        run: pip install --no-deps "yubikey-manager>=5.5,<6"
      - name: Run tests
        run: pytest supervisor/tests -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Compute image tags
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tags=${IMAGE}:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:latest,${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on master / tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker build -q -t smoke .
          docker run --rm smoke /opt/icloudpd/bin/icloudpd --version
          # icloudpd must be importable (pure-Python install): the software
          # security key runs inside its process.
          docker run --rm smoke /opt/icloudpd/bin/python -c "import fido2, cryptography, srp, keyring, icloudpd.cli, icloudpd_supervisor.softkey_run"
          docker run --rm smoke /opt/icloudpd/bin/python -m icloudpd_supervisor.softkey_run /nonexistent.json --version
          docker run --rm smoke /opt/icloudpd/bin/icloud --help
          # YubiKey-held key: yubikit and the USB path must load without the
          # dependencies that are deliberately not installed.
          docker run --rm smoke /opt/icloudpd/bin/python -c "import usb.core, yubikit.piv, yubikit.management; from icloudpd_supervisor import piv; piv._usb_connection_class(); print(list(usb.core.find(find_all=True)))"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, docker]
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            Container image: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
